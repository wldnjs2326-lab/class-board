<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 반 알림판</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: linear-gradient(180deg, #e9f7f5 0%, #dcf1ee 100%);
    color: #0f3d3a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  .today-date {
    font-size: 56px;
    font-weight: 800;
    color: #0d6b62;
    letter-spacing: 1px;
  }

  .board-title {
    font-size: 30px;
    font-weight: 700;
    color: #14867a;
    margin-top: 6px;
  }

  .category-area {
    width: 100%;
    max-width: 900px;
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  .cat-btn {
    flex: 1;
    font-size: 24px;
    font-weight: 700;
    padding: 14px 0;
    border: 3px solid transparent;
    border-radius: 14px;
    background: #eef4f3;
    color: #6b8f8b;
    cursor: pointer;
    transition: transform 0.1s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  .cat-btn:active {
    transform: scale(0.97);
  }

  .cat-btn[data-category="알림"].active {
    background: #dce8ff;
    border-color: #6d94e0;
    color: #2d4f8f;
  }

  .cat-btn[data-category="할 일"].active {
    background: #fff0cf;
    border-color: #e0ab3d;
    color: #8a5f0c;
  }

  .cat-btn[data-category="칭찬"].active {
    background: #ffdcea;
    border-color: #e06693;
    color: #99295a;
  }

  .input-area {
    width: 100%;
    max-width: 900px;
    display: flex;
    gap: 14px;
    margin-bottom: 40px;
  }

  #notice-input {
    flex: 1;
    font-size: 30px;
    padding: 20px 24px;
    border: 3px solid #14867a;
    border-radius: 16px;
    outline: none;
    background: #ffffff;
    color: #0f3d3a;
  }

  #notice-input:focus {
    border-color: #0d6b62;
    box-shadow: 0 0 0 4px rgba(20, 134, 122, 0.2);
  }

  #add-btn {
    font-size: 30px;
    font-weight: 700;
    padding: 20px 36px;
    border: none;
    border-radius: 16px;
    background: #0d6b62;
    color: #ffffff;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  #add-btn:hover {
    background: #0a544e;
  }

  #add-btn:active {
    transform: scale(0.98);
  }

  .board {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .notice-card {
    background: #ffffff;
    border-left: 12px solid #14867a;
    border-radius: 18px;
    padding: 28px 30px;
    box-shadow: 0 6px 16px rgba(15, 61, 58, 0.12);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    animation: pop-in 0.25s ease;
  }

  .notice-card[data-category="알림"] {
    background: #eaf1ff;
    border-left-color: #6d94e0;
  }

  .notice-card[data-category="할 일"] {
    background: #fff7e2;
    border-left-color: #e0ab3d;
  }

  .notice-card[data-category="칭찬"] {
    background: #ffedf4;
    border-left-color: #e06693;
  }

  .notice-card.done {
    opacity: 0.55;
  }

  @keyframes pop-in {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .done-checkbox {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    margin-top: 6px;
    cursor: pointer;
    accent-color: #0d6b62;
  }

  .notice-content {
    flex: 1;
  }

  .notice-category {
    display: inline-block;
    font-size: 18px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 999px;
    background: rgba(15, 61, 58, 0.08);
    color: #0d6b62;
    margin-bottom: 10px;
  }

  .notice-text {
    font-size: 34px;
    font-weight: 700;
    line-height: 1.4;
    word-break: break-word;
  }

  .notice-text.done {
    text-decoration: line-through;
    color: #7c8f8d;
  }

  .notice-time {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 600;
    color: #4c8f88;
  }

  .delete-btn {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    font-size: 26px;
    font-weight: 700;
    border: none;
    border-radius: 50%;
    background: #f1f8f7;
    color: #0d6b62;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .delete-btn:hover {
    background: #e05252;
    color: #ffffff;
  }

  .empty-message {
    text-align: center;
    font-size: 26px;
    color: #6ba39b;
    padding: 40px 0;
  }

  .tv-toggle-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 18px;
    font-weight: 700;
    padding: 10px 18px;
    border: 2px solid #14867a;
    border-radius: 10px;
    background: #ffffff;
    color: #0d6b62;
    cursor: pointer;
    z-index: 10;
    transition: opacity 0.2s ease;
  }

  body.tv-mode .tv-toggle-btn {
    opacity: 0.3;
  }

  body.tv-mode .tv-toggle-btn:hover {
    opacity: 1;
  }

  body.tv-mode .category-area,
  body.tv-mode .input-area,
  body.tv-mode .delete-btn,
  body.tv-mode .done-checkbox {
    display: none !important;
  }

  body.tv-mode header,
  body.tv-mode .board {
    max-width: 1600px;
  }

  body.tv-mode .today-date {
    font-size: 100px;
  }

  body.tv-mode .board-title {
    font-size: 46px;
  }

  body.tv-mode .notice-card {
    padding: 44px 48px;
  }

  body.tv-mode .board {
    gap: 34px;
  }

  body.tv-mode .notice-category {
    font-size: 26px;
    padding: 6px 20px;
  }

  body.tv-mode .notice-text {
    font-size: 60px;
  }

  body.tv-mode .notice-time {
    font-size: 28px;
  }
</style>
</head>
<body>

<button id="tv-toggle-btn" class="tv-toggle-btn">TV 모드 켜기</button>

<header>
  <div class="today-date" id="today-date"></div>
  <div class="board-title">우리 반 알림판</div>
</header>

<div class="category-area" id="category-area">
  <button class="cat-btn" data-category="알림">알림</button>
  <button class="cat-btn" data-category="할 일">할 일</button>
  <button class="cat-btn" data-category="칭찬">칭찬</button>
</div>

<div class="input-area">
  <input type="text" id="notice-input" placeholder="알릴 내용을 입력하세요" maxlength="200">
  <button id="add-btn">추가</button>
</div>

<div class="board" id="board"></div>

<script>
  const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

  function renderToday() {
    const now = new Date();
    const text = `${now.getMonth() + 1}월 ${now.getDate()}일 ${WEEKDAYS[now.getDay()]}요일`;
    document.getElementById("today-date").textContent = text;
  }

  function formatTime(date) {
    let hours = date.getHours();
    const minutes = String(date.getMinutes()).padStart(2, "0");
    const period = hours < 12 ? "오전" : "오후";
    hours = hours % 12;
    if (hours === 0) hours = 12;
    return `${period} ${hours}:${minutes} 작성`;
  }

  const STORAGE_KEY = "class-board-notices";
  const CATEGORIES = ["알림", "할 일", "칭찬"];
  let selectedCategory = "알림";

  let notices = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]").map((n) => ({
    ...n,
    category: CATEGORIES.includes(n.category) ? n.category : "알림",
    done: !!n.done,
  }));

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notices));
  }

  function renderCategoryButtons() {
    document.querySelectorAll(".cat-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.category === selectedCategory);
    });
  }

  document.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedCategory = btn.dataset.category;
      renderCategoryButtons();
      document.getElementById("notice-input").focus();
    });
  });

  function renderBoard() {
    const board = document.getElementById("board");
    board.innerHTML = "";

    if (notices.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-message";
      empty.textContent = "등록된 알림이 없습니다.";
      board.appendChild(empty);
      return;
    }

    notices.forEach((notice) => {
      const card = document.createElement("div");
      card.className = "notice-card" + (notice.done ? " done" : "");
      card.dataset.category = notice.category;

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "done-checkbox";
      checkbox.checked = notice.done;
      checkbox.addEventListener("change", () => {
        notice.done = checkbox.checked;
        save();
        renderBoard();
      });

      const content = document.createElement("div");
      content.className = "notice-content";

      const category = document.createElement("div");
      category.className = "notice-category";
      category.textContent = notice.category;

      const text = document.createElement("div");
      text.className = "notice-text" + (notice.done ? " done" : "");
      text.textContent = notice.text;

      const time = document.createElement("div");
      time.className = "notice-time";
      time.textContent = formatTime(new Date(notice.createdAt));

      content.appendChild(category);
      content.appendChild(text);
      content.appendChild(time);

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "delete-btn";
      deleteBtn.textContent = "×";
      deleteBtn.addEventListener("click", () => {
        notices = notices.filter((n) => n.id !== notice.id);
        save();
        renderBoard();
      });

      card.appendChild(checkbox);
      card.appendChild(content);
      card.appendChild(deleteBtn);
      board.appendChild(card);
    });
  }

  function addNotice() {
    const input = document.getElementById("notice-input");
    const value = input.value.trim();
    if (!value) return;

    notices.unshift({
      id: Date.now(),
      text: value,
      category: selectedCategory,
      done: false,
      createdAt: new Date().toISOString(),
    });

    save();
    renderBoard();
    input.value = "";
    input.focus();
  }

  document.getElementById("add-btn").addEventListener("click", addNotice);
  document.getElementById("notice-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addNotice();
  });

  const TV_MODE_KEY = "class-board-tv-mode";
  let tvMode = localStorage.getItem(TV_MODE_KEY) === "1";

  function applyTvMode() {
    document.body.classList.toggle("tv-mode", tvMode);
    document.getElementById("tv-toggle-btn").textContent = tvMode ? "TV 모드 끄기" : "TV 모드 켜기";
  }

  document.getElementById("tv-toggle-btn").addEventListener("click", () => {
    tvMode = !tvMode;
    localStorage.setItem(TV_MODE_KEY, tvMode ? "1" : "0");
    applyTvMode();
  });

  renderToday();
  renderCategoryButtons();
  renderBoard();
  applyTvMode();
  setInterval(renderToday, 60 * 1000);
</script>

</body>
</html>
