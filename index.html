<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자리 뽑기</title>
<style>
  :root {
    --bg: #f4f1ea;
    --board: #2f4f45;
    --board-text: #f3f1e7;
    --seat: #ffffff;
    --seat-border: #c9c2b2;
    --seat-text: #2b3a4a;
    --accent: #4a6fa5;
    --accent-dark: #3a5985;
    --muted: #7a7466;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--seat-text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2vh 3vw 3vh;
    gap: 2.5vh;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    flex-wrap: wrap;
    justify-content: center;
    font-size: clamp(1.2rem, 2.2vw, 2rem);
    font-weight: 600;
  }
  .controls input {
    width: 5.5em;
    font-size: inherit;
    font-weight: 700;
    text-align: center;
    padding: 0.3em 0.4em;
    border: 3px solid var(--seat-border);
    border-radius: 12px;
    background: #fff;
    color: var(--seat-text);
  }
  .controls input:focus { outline: none; border-color: var(--accent); }
  .controls button {
    font-size: inherit;
    font-weight: 700;
    padding: 0.35em 1.4em;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .controls button:hover { background: var(--accent-dark); }
  .controls button:active { transform: scale(0.97); }
  .message {
    min-height: 1.4em;
    font-size: clamp(1rem, 1.6vw, 1.5rem);
    color: #a0522d;
    font-weight: 600;
  }
  .board {
    width: min(70%, 900px);
    background: var(--board);
    color: var(--board-text);
    text-align: center;
    font-size: clamp(2rem, 4.5vw, 4.5rem);
    font-weight: 800;
    letter-spacing: 0.5em;
    padding: 0.35em 0 0.35em 0.5em;
    border-radius: 14px;
    border: 8px solid #8b6f4e;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  }
  .seats {
    width: min(100%, 1500px);
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: clamp(0.6rem, 1.6vw, 1.8rem);
    flex: 1;
    align-content: start;
  }
  .seat {
    aspect-ratio: 3 / 2;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--seat);
    border: 3px solid var(--seat-border);
    border-radius: 16px;
    font-size: clamp(2rem, 5.5vw, 6rem);
    font-weight: 800;
    color: var(--seat-text);
    box-shadow: 0 3px 8px rgba(0,0,0,0.06);
  }
  .seat.empty {
    background: transparent;
    border-style: dashed;
    box-shadow: none;
    color: transparent;
  }
  .seat.pop { animation: pop 0.35s ease-out both; }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.8); }
    to   { opacity: 1; transform: scale(1); }
  }
  .hint {
    font-size: clamp(0.9rem, 1.3vw, 1.2rem);
    color: var(--muted);
  }
</style>
</head>
<body>

  <div class="controls">
    <label for="count">학생 수</label>
    <input type="number" id="count" value="24" min="1" max="60">
    <button id="drawBtn">자리 뽑기</button>
  </div>
  <div class="message" id="message"></div>

  <div class="board">칠판</div>

  <div class="seats" id="seats"></div>

  <div class="hint">가로 6자리 · 칠판에 가까운 줄이 앞줄입니다</div>

<script>
  var COLS = 6;
  var MIN_ROWS = 4;
  var MAX_STUDENTS = 60;

  var seatsEl = document.getElementById('seats');
  var countEl = document.getElementById('count');
  var msgEl = document.getElementById('message');

  function randomInt(max) {
    if (window.crypto && window.crypto.getRandomValues) {
      var buf = new Uint32Array(1);
      var limit = Math.floor(4294967296 / max) * max;
      do { window.crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % max;
    }
    return Math.floor(Math.random() * max);
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randomInt(i + 1);
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function render(numbers, total, animate) {
    var rows = Math.max(MIN_ROWS, Math.ceil(total / COLS));
    var slots = rows * COLS;
    seatsEl.innerHTML = '';
    for (var i = 0; i < slots; i++) {
      var div = document.createElement('div');
      div.className = 'seat';
      if (numbers && i < numbers.length) {
        div.textContent = numbers[i];
        if (animate) {
          div.classList.add('pop');
          div.style.animationDelay = (i * 0.03) + 's';
        }
      } else if (i >= total) {
        div.classList.add('empty');
      }
      seatsEl.appendChild(div);
    }
  }

  function draw() {
    var n = parseInt(countEl.value, 10);
    if (isNaN(n) || n < 1) {
      msgEl.textContent = '학생 수를 1 이상으로 입력해 주세요.';
      return;
    }
    if (n > MAX_STUDENTS) {
      msgEl.textContent = '학생 수는 ' + MAX_STUDENTS + '명까지 입력할 수 있어요.';
      return;
    }
    msgEl.textContent = '';
    var nums = [];
    for (var i = 1; i <= n; i++) nums.push(i);
    render(shuffle(nums), n, true);
  }

  document.getElementById('drawBtn').addEventListener('click', draw);
  countEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') draw();
  });
  countEl.addEventListener('input', function () {
    var n = parseInt(countEl.value, 10);
    if (!isNaN(n) && n >= 1 && n <= MAX_STUDENTS) {
      msgEl.textContent = '';
      render(null, n, false);
    }
  });

  render(null, 24, false);
</script>
</body>
</html>
